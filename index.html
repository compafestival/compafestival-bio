<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Festival 2026 - Official Bio Links</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                            neon: '#ff003c',
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, filter: 'drop-shadow(0 0 15px rgba(255, 0, 60, 0.8))' },
                            '50%': { opacity: 0.8, filter: 'drop-shadow(0 0 5px rgba(255, 0, 60, 0.3))' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0d0204;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism Red Style */
        .glass-card {
            background: rgba(20, 5, 8, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 0, 60, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-button {
            background: rgba(40, 8, 15, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 0, 60, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: rgba(225, 29, 72, 0.3);
            border-color: rgba(255, 0, 60, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(255, 0, 60, 0.4);
        }

        .glass-button-primary {
            background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
            border: 1px solid #ff003c;
            box-shadow: 0 4px 20px rgba(255, 0, 60, 0.5);
            transition: all 0.3s ease;
        }

        .glass-button-primary:hover {
            background: linear-gradient(135deg, #ff003c 0%, #be123c 100%);
            box-shadow: 0 6px 30px rgba(255, 0, 60, 0.8);
            transform: translateY(-2px) scale(1.01);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0204;
        }
        ::-webkit-scrollbar-thumb {
            background: #be123c;
            border-radius: 3px;
        }

        /* Background Overlay Image */
        .bg-festival {
            background-image: linear-gradient(to bottom, rgba(13, 2, 4, 0.75), rgba(13, 2, 4, 0.95)), 
                              url('background.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-festival min-h-screen flex flex-col justify-between items-center px-4 py-8 relative">

    
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-red-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-0 left-10 w-80 h-80 bg-rose-900/30 rounded-full blur-[100px] pointer-events-none"></div>

    <main class="w-full max-w-sm sm:max-w-md mx-auto z-10 flex flex-col items-center px-1">
        
        
        <div class="text-center mb-6 w-full">
            <div class="relative inline-block mb-4">
                <div class="w-28 h-28 rounded-full p-1 bg-gradient-to-tr from-red-600 via-rose-500 to-amber-500 animate-pulse-glow">
                    <img id="profile-img" src="fotoprofil.jpeg" 
                         alt="Festival Logo" 
                         class="w-full h-full object-cover rounded-full border-2 border-black">
                </div>
                <span class="absolute bottom-1 right-1 bg-brand-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full border border-black uppercase tracking-wider">
                    LIVE 2027
                </span>
            </div>

            <h1 class="text-2xl font-black tracking-tight text-white flex items-center justify-center gap-2">
                COMPA FESTIVAL
                <i class="fa-solid fa-circle-check text-brand-500 text-lg"></i>
            </h1>
            <p class="text-sm text-rose-200/80 mt-1 font-medium">The Festival Music • Pati</p>
            <p class="text-sm text-rose-200/80 mt-1 font-medium">🗓️ Mei 2027</p>
            <p class="text-sm text-rose-200/80 mt-1 font-medium">📍 Pati (Coming Soon)</p>
        </div>

        
        <div class="w-full space-y-3.5">
            
            
            <a href="https://www.instagram.com/compafestival?exln=MWUwb2lmNDU0MW54eQ==_" target="_blank" rel="noopener noreferrer" 
               class="glass-button w-full p-3.5 rounded-xl flex items-center justify-between group">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-lg bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center justify-center text-xl">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-white group-hover:text-brand-500 transition-colors">Instagram Resmi</span>
                        <span class="block text-xs text-gray-400">@compafestival • Update & Line-Up</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-500 group-hover:text-white transition-colors"></i>
            </a>


            <a href="https://www.tiktok.com/@compafestival?_r=1&_t=ZS-9BRyO5WxxJ6" target="_blank" rel="noopener noreferrer" 
               class="glass-button w-full p-3.5 rounded-xl flex items-center justify-between group border border-[#fe2c55]/30 hover:border-[#00f2fe]/50 transition-all duration-300 shadow-[0_0_15px_rgba(254,44,85,0.15)] hover:shadow-[0_0_20px_rgba(0,242,254,0.25)]">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#fe2c55]/20 to-[#00f2fe]/20 text-white border border-[#fe2c55]/40 flex items-center justify-center text-xl shadow-[0_0_10px_rgba(254,44,85,0.3)] group-hover:shadow-[0_0_12px_rgba(0,242,254,0.4)] transition-all">
                        <i class="fa-brands fa-tiktok text-transparent bg-clip-text bg-gradient-to-r from-[#fe2c55] to-[#00f2fe] drop-shadow-[0_0_5px_rgba(254,44,85,0.8)]"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-sm font-bold text-white group-hover:text-[#00f2fe] transition-colors">Tiktok Resmi</span>
                        <span class="block text-xs text-gray-400">@compafestival • Update & Line-Up</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-500 group-hover:text-[#00f2fe] transition-colors"></i>
            </a>

            
        </div>

    </main>

    
    <footer class="mt-8 text-center text-xs text-gray-500 z-10">
        <p>© 2027 Compa Festival x Northjava. All rights reserved.</p>
    </footer>

    
    <script>
        
        const eventDate = new Date("May 1, 2027 15:00:00").getTime();

        const updateTimer = () => {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? '0' + days : days;
            document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
        };

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
